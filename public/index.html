<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link to APK Builder - Pro</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1e1b4b, #0f172a);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 24px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        /* Icon Upload & Preview */
        .icon-uploader {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .icon-preview-box {
            width: 75px;
            height: 75px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .icon-preview-box:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .icon-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .icon-label {
            font-size: 12px;
            color: #cbd5e1;
            cursor: pointer;
        }

        #iconInput {
            display: none;
        }

        /* Form Inputs */
        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 12px 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }

        input[type="text"]:focus, input[type="url"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }

        /* Submit Button */
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #4338ca);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(99, 102, 241, 0.5);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Progress Bar */
        .progress-container {
            display: none;
            margin-top: 20px;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1, #ec4899);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        #statusText {
            margin-top: 10px;
            font-size: 13px;
            color: #cbd5e1;
        }

        .download-box {
            display: none;
            margin-top: 20px;
            animation: fadeIn 0.5s ease-out;
        }

        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
            transition: all 0.3s;
        }

        .download-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Web to APK Studio</h2>
    <p class="subtitle">Convert any website into a real Android App</p>

    <!-- App Icon Upload -->
    <div class="icon-uploader">
        <label for="iconInput" class="icon-preview-box" id="previewContainer">
            <span id="uploadPlaceholder">🖼️ Icon</span>
            <img id="iconPreview" alt="App Icon">
        </label>
        <label for="iconInput" class="icon-label">Tap to upload App Icon</label>
        <input type="file" id="iconInput" accept="image/*" onchange="previewImage(event)">
    </div>

    <!-- Inputs -->
    <div class="input-group">
        <label>App Name</label>
        <input type="text" id="appName" placeholder="e.g. My Website App" required>
    </div>

    <div class="input-group">
        <label>Website URL</label>
        <input type="url" id="webUrl" placeholder="https://yourwebsite.com" required>
    </div>

    <button id="buildBtn" onclick="generateAPK()">Build APK Now</button>

    <!-- Progress UI -->
    <div class="progress-container" id="progressArea">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <p id="statusText">Starting build process...</p>
    </div>

    <!-- Download Button Area -->
    <div class="download-box" id="downloadArea">
        <a href="#" id="downloadLink" class="download-btn" download>📥 Download Generated APK</a>
    </div>
</div>

<script>
    // Live Icon Preview
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('iconPreview');
                img.src = e.target.result;
                img.style.display = 'block';
                document.getElementById('uploadPlaceholder').style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }

    async function generateAPK() {
        const appName = document.getElementById('appName').value.trim();
        const webUrl = document.getElementById('webUrl').value.trim();
        const buildBtn = document.getElementById('buildBtn');
        const progressArea = document.getElementById('progressArea');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const downloadArea = document.getElementById('downloadArea');
        const downloadLink = document.getElementById('downloadLink');

        if (!appName || !webUrl) {
            alert("Please provide both App Name and Website URL!");
            return;
        }

        buildBtn.disabled = true;
        downloadArea.style.display = 'none';
        progressArea.style.display = 'block';

        // Step 1: Validating
        progressFill.style.width = '25%';
        statusText.innerText = "Configuring App Settings...";

        setTimeout(async () => {
            progressFill.style.width = '60%';
            statusText.innerText = "Compiling & Signing APK...";

            try {
                const response = await fetch('/api/generate-apk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ appName, webUrl })
                });

                const data = await response.json();

                if (response.ok && data.downloadUrl) {
                    progressFill.style.width = '100%';
                    statusText.innerText = "APK Generated Successfully!";
                    downloadLink.href = data.downloadUrl;
                    downloadLink.setAttribute('download', `${appName.replace(/\s+/g, '_')}.apk`);
                    downloadArea.style.display = 'block';
                } else {
                    statusText.innerText = "Error: " + (data.error || "Failed to generate APK");
                }
            } catch (err) {
                statusText.innerText = "Connection error! Check server logs.";
            } finally {
                buildBtn.disabled = false;
            }
        }, 1500);
    }
</script>

</body>
</html>
