<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Web & HTML to APK Maker</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --accent: #06b6d4;
            --bg: #090d16;
            --card-bg: rgba(17, 24, 39, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: radial-gradient(circle at 50% 0%, #1e1b4b, var(--bg)); color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 25px; width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .token-badge { background: linear-gradient(135deg, var(--primary), var(--accent)); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }

        .type-toggle { display: flex; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
        .toggle-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #94a3b8; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .toggle-btn.active { background: var(--primary); color: white; }

        .icon-uploader { display: flex; flex-direction: column; align-items: center; margin-bottom: 15px; }
        .icon-preview { width: 70px; height: 70px; border-radius: 18px; border: 2px dashed rgba(255,255,255,0.2); display: flex; justify-content: center; align-items: center; overflow: hidden; cursor: pointer; }
        .icon-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        input[type="text"], input[type="url"], input[type="file"] { width: 100%; padding: 11px; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: white; font-size: 13px; }

        .anim-checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 15px 0; color: #cbd5e1; }
        .anim-checkbox input { width: 16px; height: 16px; accent-color: var(--primary); }

        .build-btn { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .build-btn:hover { opacity: 0.9; transform: scale(1.02); }
        .build-btn:disabled { background: #475569; cursor: not-allowed; transform: none; }

        .status { margin-top: 15px; text-align: center; font-size: 13px; color: #38bdf8; }
        .download-btn { display: none; margin-top: 15px; width: 100%; padding: 12px; background: #10b981; color: white; text-align: center; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h3>APK Builder Pro</h3>
        <span class="token-badge" id="tokenDisplay">টোকেন: লোড হচ্ছে...</span>
    </div>

    <!-- মোড সিলেকশন (URL নাকি অফলাইন HTML) -->
    <div class="type-toggle">
        <button class="toggle-btn active" id="modeUrl" onclick="switchMode('url')">Website Link</button>
        <button class="toggle-btn" id="modeHtml" onclick="switchMode('html')">HTML Zip (Max 5MB)</button>
    </div>

    <!-- অ্যাপ আইকন (Max 1MB) -->
    <div class="icon-uploader">
        <label for="appIcon" class="icon-preview">
            <span id="iconText">Icon</span>
            <img id="iconImg" alt="Preview">
        </label>
        <span style="font-size: 11px; color: #94a3b8; margin-top: 4px;">App Icon (Max 1 MB)</span>
        <input type="file" id="appIcon" accept="image/*" style="display:none;" onchange="previewIcon(event)">
    </div>

    <div class="form-group">
        <label>App Name</label>
        <input type="text" id="appName" placeholder="যেমন: My Super App">
    </div>

    <div class="form-group">
        <label>Package Name (Play Store স্টাইল)</label>
        <input type="text" id="packageName" placeholder="যেমন: com.mycompany.app" value="com.app.webview">
    </div>

    <!-- লিংক ইনপুট -->
    <div class="form-group" id="urlGroup">
        <label>Website URL</label>
        <input type="url" id="targetUrl" placeholder="https://example.com">
    </div>

    <!-- HTML Zip ইনপুট -->
    <div class="form-group" id="htmlGroup" style="display: none;">
        <label>Upload HTML, CSS, JS Zip File (Max 5 MB)</label>
        <input type="file" id="htmlZip" accept=".zip">
    </div>

    <!-- ওপেনিং অ্যানিমেশন চেকবক্স -->
    <div class="anim-checkbox">
        <input type="checkbox" id="splashAnimation" checked>
        <label for="splashAnimation">App Opening Animation / Splash Screen যুক্ত থাকবে</label>
    </div>

    <button class="build-btn" id="buildBtn" onclick="createAPK()">Create APK</button>

    <p class="status" id="statusBox"></p>
    <a href="#" class="download-btn" id="downloadBtn" download>📥 Download Created APK</a>
</div>

<script>
    let currentMode = 'url';

    // ডিভাইস আইডি সেটআপ (ইউনিক আইডি প্রতি ফোনের জন্য)
    let deviceId = localStorage.getItem('user_device_id');
    if (!deviceId) {
        deviceId = 'dev_' + Math.random().toString(36).substring(2, 9) + Date.now();
        localStorage.setItem('user_device_id', deviceId);
    }

    // টোকেন সংখ্যা চেক
    async function updateTokenCount() {
        try {
            const res = await fetch(`/api/check-tokens/${deviceId}`);
            const data = await res.json();
            document.getElementById('tokenDisplay').innerText = `আজকের বাকি: ${data.tokens} / 5 APK`;
            if (data.tokens <= 0) {
                document.getElementById('buildBtn').disabled = true;
                document.getElementById('statusBox').innerText = "আজকের ৫টি APK লিমিট শেষ হয়ে গেছে!";
            }
        } catch(e) {}
    }
    updateTokenCount();

    function switchMode(mode) {
        currentMode = mode;
        if (mode === 'url') {
            document.getElementById('modeUrl').classList.add('active');
            document.getElementById('modeHtml').classList.remove('active');
            document.getElementById('urlGroup').style.display = 'block';
            document.getElementById('htmlGroup').style.display = 'none';
        } else {
            document.getElementById('modeHtml').classList.add('active');
            document.getElementById('modeUrl').classList.remove('active');
            document.getElementById('urlGroup').style.display = 'none';
            document.getElementById('htmlGroup').style.display = 'block';
        }
    }

    function previewIcon(e) {
        const file = e.target.files[0];
        if (file) {
            if (file.size > 1024 * 1024) {
                alert("আইকন সাইজ ১ MB-এর কম হতে হবে!");
                e.target.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = () => {
                document.getElementById('iconImg').src = reader.result;
                document.getElementById('iconImg').style.display = 'block';
                document.getElementById('iconText').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    }

    async function createAPK() {
        const appName = document.getElementById('appName').value.trim();
        const packageName = document.getElementById('packageName').value.trim();
        const splashAnimation = document.getElementById('splashAnimation').checked;
        const iconFile = document.getElementById('appIcon').files[0];
        const statusBox = document.getElementById('statusBox');
        const downloadBtn = document.getElementById('downloadBtn');
        const buildBtn = document.getElementById('buildBtn');

        if (!appName || !packageName) {
            alert("App Name এবং Package Name পূরণ করুন!");
            return;
        }

        const formData = new FormData();
        formData.append('deviceId', deviceId);
        formData.append('appName', appName);
        formData.append('packageName', packageName);
        formData.append('splashAnimation', splashAnimation);

        if (iconFile) formData.append('appIcon', iconFile);

        if (currentMode === 'url') {
            const url = document.getElementById('targetUrl').value.trim();
            if (!url) { alert("Website URL দিন!"); return; }
            formData.append('targetUrl', url);
        } else {
            const zip = document.getElementById('htmlZip').files[0];
            if (!zip) { alert("HTML Zip ফাইল আপলোড করুন!"); return; }
            if (zip.size > 5 * 1024 * 1024) { alert("Zip ফাইল ৫ MB-এর কম হতে হবে!"); return; }
            formData.append('htmlZip', zip);
        }

        buildBtn.disabled = true;
        downloadBtn.style.display = 'none';
        statusBox.innerText = "APK তৈরি হচ্ছে... অপেক্ষা করুন...";

        try {
            const res = await fetch('/api/create-apk', { method: 'POST', body: formData });
            const data = await res.json();

            if (res.ok && data.success) {
                statusBox.innerText = "সফলভাবে তৈরি হয়েছে!";
                downloadBtn.href = data.downloadUrl;
                downloadBtn.style.display = 'block';
                document.getElementById('tokenDisplay').innerText = `আজকের বাকি: ${data.tokensRemaining} / 5 APK`;
            } else {
                statusBox.innerText = "ত্রুটি: " + (data.error || "ব্যর্থ হয়েছে");
            }
        } catch(e) {
            statusBox.innerText = "সার্ভারের সাথে যোগাযোগ ব্যর্থ হয়েছে!";
        } finally {
            buildBtn.disabled = false;
        }
    }
</script>

</body>
</html>
